<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>matthew madden</title>
        <meta name="description" content="To be scrapped in favor of windows aero">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow:hidden;
            background-color: #0b0b09;
            font-family: Arial;
            color: #ffffff;
        }

        #bg-video {
            position: fixed;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
        }

        .name {
            position: absolute;
            top: 30%;
            left: 30%;
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: clamp(1.5rem, 5vw, 3rem);
        }

        .glow{
            text-shadow:
                0 0 10px rgba(147, 168, 106, 0.6),
                0 0 20px rgba(147, 168, 106, 0.4),
                0 0 40px rgba(147, 168, 106, 0.3),
                0 0 80px rgba(147, 168, 106, 0.2);
        }

        .menu {
            position: absolute;
            top: 10%;
            right: 10%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;            
            align-items: flex-end; 
        }

        .menu li a {
            display: flex;
            gap: 0.5rem;
        }

        .menu li a:hover {
            opacity: 0.7;
        }

        </style>
    </head>
    <body>
        <video autoplay muted loop playsinline id="bg-video">
            <source src="background.mp4" type="video/mp4">
        </video>
        <div class="content">
        <h1 class="name glow">Matthew Madden</h1>

        <ul class="menu">
            <li><a class="glow"><i class="fa-solid fa-user"></i>About Me</a></li>
            <li><a class="glow"><i class="fa-solid fa-file-lines"></i>Resume</a></li>
            <li><a class="glow"><i class="fa-solid fa-gamepad"></i>Hobby</a></li>
            <li><a class="glow"><i class="fa-solid fa-briefcase"></i>Work</a></li>  
        </ul>
        </div>
    </body>
</html>
